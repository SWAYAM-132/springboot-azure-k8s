parameters:
  - name: stageName
    type: string
  - name: displayName
    type: string
  - name: dependsOn
    type: object
  - name: agentPool
    type: string
  - name: azureClientId
    type: string
  - name: overlay
    type: string
  - name: namespace
    type: string
  - name: replicas
    type: number
  - name: aksResourceGroup
    type: string
  - name: aksCluster
    type: string
  - name: adoEnvironment
    type: string

stages:
- stage: ${{ parameters.stageName }}
  displayName: ${{ parameters.displayName }}
  dependsOn: ${{ parameters.dependsOn }}
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/dev'))
  variables:
    imageDigest: $[ stageDependencies.Build.BuildAndPush.outputs['PublishImage.imageDigest'] ]
  jobs:
  - deployment: DeployOverlay
    displayName: Apply ${{ parameters.overlay }} Kustomize overlay
    environment: ${{ parameters.adoEnvironment }}
    pool:
      name: ${{ parameters.agentPool }}
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            clean: true
          - bash: |
              set -euo pipefail
              az login --identity --client-id "${{ parameters.azureClientId }}" --output none
              az account set --subscription "$AZURE_SUBSCRIPTION_ID"

              IMAGE_DIGEST="$(imageDigest)"
              [[ "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
              IMAGE="$(acrName).azurecr.io/$(imageRepository)@${IMAGE_DIGEST}"
              OVERLAY="$(Build.SourcesDirectory)/k8s/overlays/${{ parameters.overlay }}"

              az aks get-credentials \
                --resource-group "${{ parameters.aksResourceGroup }}" \
                --name "${{ parameters.aksCluster }}" \
                --overwrite-existing
              kubelogin convert-kubeconfig -l azurecli

              for value in "$(tenantId)" "$(entraSpaClientId)" "$(todoApiAudience)" \
                  "$(todoApiScope)" "$(workloadIdentityClientId)" "$(keyVaultName)"; do
                test -n "${value}"
                [[ "${value}" != REPLACE_WITH_* ]]
              done

              kubectl -n "${{ parameters.namespace }}" create configmap todo-api-auth \
                --from-literal=entraTenantId="$(tenantId)" \
                --from-literal=entraSpaClientId="$(entraSpaClientId)" \
                --from-literal=apiAudience="$(todoApiAudience)" \
                --from-literal=apiScope="$(todoApiScope)" \
                --dry-run=client -o yaml | kubectl apply -f -

              MANIFEST="$(mktemp)"
              TRANSFORMED="$(mktemp)"
              trap 'rm -f "${MANIFEST}" "${TRANSFORMED}"' EXIT
              kubectl kustomize "${OVERLAY}" \
                | envsubst '${WORKLOAD_IDENTITY_CLIENT_ID} ${KEYVAULT_NAME} ${AZURE_TENANT_ID}' \
                > "${MANIFEST}"

              IMAGE_LINE='        image: acrtodoplatformci.azurecr.io/todo-api:latest'
              test "$(grep -Fxc "${IMAGE_LINE}" "${MANIFEST}")" = 1
              sed "s|${IMAGE_LINE}|        image: ${IMAGE}|" "${MANIFEST}" > "${TRANSFORMED}"
              grep -Fq "image: ${IMAGE}" "${TRANSFORMED}"
              kubectl apply -f "${TRANSFORMED}"
              kubectl -n "${{ parameters.namespace }}" rollout status deployment/todo-api --timeout=180s

              DEPLOYED_IMAGE="$(kubectl -n "${{ parameters.namespace }}" get deployment todo-api \
                -o jsonpath='{.spec.template.spec.containers[?(@.name=="todo-api")].image}')"
              test "${DEPLOYED_IMAGE}" = "${IMAGE}"
              READY_REPLICAS="$(kubectl -n "${{ parameters.namespace }}" get deployment todo-api \
                -o jsonpath='{.status.readyReplicas}')"
              test "${READY_REPLICAS}" = "${{ parameters.replicas }}"
              kubectl -n "${{ parameters.namespace }}" get pods -l app=todo-api
            displayName: Managed identity deployment and rollout validation
            env:
              AZURE_SUBSCRIPTION_ID: '5282ac61-9692-4758-b6cd-1d6a859625a2'
              WORKLOAD_IDENTITY_CLIENT_ID: $(workloadIdentityClientId)
              KEYVAULT_NAME: $(keyVaultName)
              AZURE_TENANT_ID: $(tenantId)
