spring.datasource.url=jdbc:h2:mem:todo;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/test-tenant/v2.0
spring.security.oauth2.resourceserver.jwt.audiences=test-api
todo.auth.tenant-id=test-tenant
todo.auth.client-id=test-client
todo.auth.api-scope=api://test-api/access_as_user
