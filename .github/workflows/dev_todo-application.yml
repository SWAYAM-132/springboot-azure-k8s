
name: Build and Deploy Spring Boot App

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: microsoft
          cache: maven

      - name: Build Spring Boot JAR
        run: mvn clean package -DskipTests

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: target/*.jar
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read

    steps:
      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: java-app

      - name: Verify JAR
        run: ls -lh *.jar

      - name: Deploy to Azure Production
        uses: azure/webapps-deploy@v3
        with:
          app-name: todo-application
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_5A7B954B0A934EE2A7BC9D9C3F4EBAAB }}
          package: '*.jar'
