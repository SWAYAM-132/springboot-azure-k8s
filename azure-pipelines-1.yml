trigger: none

pool:
  vmImage: ubuntu-latest

steps:
  - task: AzureCLI@2
    displayName: Verify Azure and ACR access
    inputs:
      azureSubscription: 'sc-todo-platform-acr-ci'
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        az account show --output table

        az acr show \
          --name acrtodoplatformci \
          --resource-group rg-todo-platform-ci \
          --query "{name:name,loginServer:loginServer}" \
          --output table

        az acr login --name acrtodoplatformci