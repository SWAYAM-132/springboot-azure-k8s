trigger:
  branches:
    include:
      - dev

pr:
  branches:
    include:
      - dev
      - stage
      - release

# Non-secret application configuration lives here, not in an ADO variable group.
# Replace the two Entra application placeholders after confirming which app
# registration is the SPA and which is the API.
variables:
  acrName: acrtodoplatformci
  imageRepository: todo-api
  tenantId: '7731b71e-59e7-46a7-99f3-472d8a0ed1bf'
  keyVaultName: kv-todo-ci-springboot
  workloadIdentityClientId: '130cbe1e-2e5a-4d63-a357-96b80667fc1e'
  entraSpaClientId: 'REPLACE_WITH_CONFIRMED_SPA_CLIENT_ID'
  todoApiAudience: 'REPLACE_WITH_CONFIRMED_API_AUDIENCE'
  todoApiScope: 'REPLACE_WITH_CONFIRMED_API_SCOPE'
  nonprodAzureClientId: 'c485c574-99de-4371-a2c4-51254f5a6c53'
  prodAzureClientId: '38e0b42f-808a-4621-9f5b-92751f45f75b'

stages:
- stage: Build
  displayName: Test and publish immutable image
  jobs:
  # Untrusted pull requests never execute on a VM carrying an Azure identity.
  - job: Verify
    displayName: Maven verification
    pool:
      vmImage: ubuntu-latest
    steps:
    - checkout: self
      clean: true
    - task: JavaToolInstaller@0
      displayName: Use Java 21
      inputs:
        versionSpec: '21'
        jdkArchitectureOption: x64
        jdkSourceOption: PreInstalled
    - bash: |
        set -euo pipefail
        chmod +x ./mvnw
        ./mvnw -B clean verify
      displayName: Maven clean verify

  - job: BuildAndPush
    displayName: Build and push from private VNet agent
    dependsOn: Verify
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    pool:
      name: todo-vnet-agent-nonprod
    steps:
    - checkout: self
      clean: true
    - bash: |
        set -euo pipefail
        az login --identity --client-id "$(nonprodAzureClientId)" --output none
        az account set --subscription "$(AZURE_SUBSCRIPTION_ID)"
        az acr login --name "$(acrName)"
        IMAGE_TAG="$(Build.SourceVersion)"
        [[ "${IMAGE_TAG}" =~ ^[0-9a-f]{40}$ ]]
        docker build --pull -t "$(acrName).azurecr.io/$(imageRepository):${IMAGE_TAG}" .
        docker push "$(acrName).azurecr.io/$(imageRepository):${IMAGE_TAG}"
        DIGEST="$(az acr manifest show-metadata \
          --registry "$(acrName)" \
          --name "$(imageRepository):${IMAGE_TAG}" \
          --query digest -o tsv)"
        [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
        echo "##vso[task.setvariable variable=imageDigest;isOutput=true]${DIGEST}"
        echo "Published image digest ${DIGEST}"
      name: PublishImage
      displayName: Authenticate with VM managed identity and push image
      env:
        AZURE_SUBSCRIPTION_ID: '5282ac61-9692-4758-b6cd-1d6a859625a2'

- template: pipelines/templates/deploy-overlay.yml
  parameters:
    stageName: Deploy_Dev
    displayName: Deploy dev to nonprod AKS
    dependsOn: [Build]
    agentPool: todo-vnet-agent-nonprod
    azureClientId: 'c485c574-99de-4371-a2c4-51254f5a6c53'
    overlay: dev
    namespace: todo-dev
    replicas: 1
    aksResourceGroup: rg-todo-nonprod-ci
    aksCluster: aks-todo-nonprod-ci
    adoEnvironment: todo-dev

- template: pipelines/templates/deploy-overlay.yml
  parameters:
    stageName: Deploy_Stage
    displayName: Deploy stage to nonprod AKS
    dependsOn: [Build, Deploy_Dev]
    agentPool: todo-vnet-agent-nonprod
    azureClientId: 'c485c574-99de-4371-a2c4-51254f5a6c53'
    overlay: stage
    namespace: todo-stage
    replicas: 2
    aksResourceGroup: rg-todo-nonprod-ci
    aksCluster: aks-todo-nonprod-ci
    adoEnvironment: todo-stage

- template: pipelines/templates/deploy-overlay.yml
  parameters:
    stageName: Deploy_Prod
    displayName: Deploy release to production AKS
    dependsOn: [Build, Deploy_Stage]
    agentPool: todo-vnet-agent-prod
    azureClientId: '38e0b42f-808a-4621-9f5b-92751f45f75b'
    overlay: prod
    namespace: todo-prod
    replicas: 3
    aksResourceGroup: rg-todo-prod-ci
    aksCluster: aks-todo-prod-ci
    adoEnvironment: todo-prod
