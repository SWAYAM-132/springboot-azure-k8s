trigger:
  branches:
    include:
      - dev

pr:
  branches:
    include:
      - dev
      - stage
      - release

variables:
  - group: todo-platform-auth
  - name: azureServiceConnection
    value: 'sc-todo-platform-acr-ci'
  - name: acrName
    value: 'acrtodoplatformci'
  - name: imageRepository
    value: 'todo-api'
  - name: dockerfilePath
    value: '$(Build.SourcesDirectory)/Dockerfile'
  - name: vmImage
    value: 'ubuntu-latest'
  - name: deployAgentPool
    value: 'todo-vnet-agent'

stages:
- stage: Build
  displayName: Test and publish image
  jobs:
  - job: BuildAndPush
    pool:
      vmImage: $(vmImage)
    steps:
    - checkout: self
      clean: true
    - task: JavaToolInstaller@0
      displayName: Use Java 21
      inputs:
        versionSpec: '21'
        jdkArchitectureOption: x64
        jdkSourceOption: PreInstalled
    - bash: |
        set -euo pipefail
        chmod +x ./mvnw
        ./mvnw -B clean verify
      displayName: Maven clean verify
    - task: AzureCLI@2
      name: PublishImage
      displayName: Build and push commit-tagged image to ACR
      condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
      inputs:
        azureSubscription: $(azureServiceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -euo pipefail
          IMAGE_TAG="$(Build.SourceVersion)"
          [[ "${IMAGE_TAG}" =~ ^[0-9a-f]{40}$ ]]
          az acr build \
            --registry "$(acrName)" \
            --image "$(imageRepository):${IMAGE_TAG}" \
            --file "$(dockerfilePath)" \
            "$(Build.SourcesDirectory)"
          DIGEST="$(az acr manifest show-metadata \
            --registry "$(acrName)" \
            --name "$(imageRepository):${IMAGE_TAG}" \
            --query digest -o tsv)"
          test -n "${DIGEST}" && test "${DIGEST}" != "None"
          echo "##vso[task.setvariable variable=imageDigest;isOutput=true]${DIGEST}"
          echo "Published $(acrName).azurecr.io/$(imageRepository):${IMAGE_TAG} (${DIGEST})"

- template: pipelines/templates/deploy-overlay.yml
  parameters:
    stageName: Deploy_Dev
    displayName: Deploy dev to nonprod AKS
    dependsOn:
      - Build
    azureServiceConnection: sc-todo-platform-acr-ci
    overlay: dev
    namespace: todo-dev
    replicas: 1
    aksResourceGroup: rg-todo-nonprod-ci
    aksCluster: aks-todo-nonprod-ci
    adoEnvironment: todo-dev

- template: pipelines/templates/deploy-overlay.yml
  parameters:
    stageName: Deploy_Stage
    displayName: Deploy stage to nonprod AKS
    dependsOn:
      - Build
      - Deploy_Dev
    azureServiceConnection: sc-todo-platform-acr-ci
    overlay: stage
    namespace: todo-stage
    replicas: 2
    aksResourceGroup: rg-todo-nonprod-ci
    aksCluster: aks-todo-nonprod-ci
    adoEnvironment: todo-stage

- template: pipelines/templates/deploy-overlay.yml
  parameters:
    stageName: Deploy_Prod
    displayName: Deploy release to prod AKS
    dependsOn:
      - Build
      - Deploy_Stage
    azureServiceConnection: sc-todo-platform-prod-ci
    overlay: prod
    namespace: todo-prod
    replicas: 3
    aksResourceGroup: rg-todo-prod-ci
    aksCluster: aks-todo-prod-ci
    adoEnvironment: todo-prod
