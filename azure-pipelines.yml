
trigger:
  - dev

pool:
  vmImage: ubuntu-latest

variables:
  ACR_NAME: swayamtodoacr2026
  IMAGE_REPOSITORY: todo-api

steps:
  # 1. Set up Java 21
  - task: JavaToolInstaller@0
    displayName: 'Set up Java 21'
    inputs:
      versionSpec: '21'
      jdkArchitectureOption: 'x64'
      jdkSourceOption: 'PreInstalled'

  # 2. Build and test Spring Boot application
  - script: |
      set -e
      java -version
      chmod +x mvnw
      ./mvnw clean verify
    displayName: 'Build and Test Spring Boot Application'

  # 3. Authenticate to Azure and push image to ACR
  - task: AzureCLI@2
    displayName: 'Build and Push Docker Image to ACR'
    inputs:
      azureSubscription: 'sc-personal-azure'
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -e

        echo "Getting ACR login server..."
        ACR_LOGIN_SERVER=$(az acr show \
          --name "$(ACR_NAME)" \
          --query loginServer \
          --output tsv)

        echo "ACR: $ACR_LOGIN_SERVER"

        echo "Logging in to ACR..."
        az acr login --name "$(ACR_NAME)"

        echo "Building Docker image..."
        docker build \
          -t "$ACR_LOGIN_SERVER/$(IMAGE_REPOSITORY):$(Build.BuildId)" \
          -t "$ACR_LOGIN_SERVER/$(IMAGE_REPOSITORY):latest" \
          .

        echo "Pushing versioned image..."
        docker push "$ACR_LOGIN_SERVER/$(IMAGE_REPOSITORY):$(Build.BuildId)"

        echo "Pushing latest image..."
        docker push "$ACR_LOGIN_SERVER/$(IMAGE_REPOSITORY):latest"

        echo "Successfully pushed images!"
