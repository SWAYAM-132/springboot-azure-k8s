apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-api
  labels:
    app: todo-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-api
  template:
    metadata:
      labels:
        app: todo-api
    spec:
      serviceAccountName: todo-api
      containers:
      - name: todo-api
        image: todo-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: TODO_ENTRA_TENANT_ID
          valueFrom:
            configMapKeyRef: { name: todo-api-auth, key: entraTenantId }
        - name: TODO_ENTRA_SPA_CLIENT_ID
          valueFrom:
            configMapKeyRef: { name: todo-api-auth, key: entraSpaClientId }
        - name: TODO_API_AUDIENCE
          valueFrom:
            configMapKeyRef: { name: todo-api-auth, key: apiAudience }
        - name: TODO_API_SCOPE
          valueFrom:
            configMapKeyRef: { name: todo-api-auth, key: apiScope }
        # Spring reads datasource settings from its standard environment variables.
        - name: SPRING_DATASOURCE_URL
          valueFrom:
            secretKeyRef: { name: todo-api-db, key: DB_URL }
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef: { name: todo-api-db, key: DB_USERNAME }
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef: { name: todo-api-db, key: DB_PASSWORD }
        - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
          value: org.postgresql.Driver
        - name: SPRING_JPA_HIBERNATE_DDL_AUTO
          value: validate
        - name: SPRING_JPA_OPEN_IN_VIEW
          value: "false"
        - name: SPRING_DATA_WEB_PAGEABLE_MAX_PAGE_SIZE
          value: "100"
        - name: SPRING_FLYWAY_BASELINE_ON_MIGRATE
          value: "true"
        - name: SPRING_FLYWAY_BASELINE_VERSION
          value: "0"
        - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
          value: health,info
        - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
          value: "true"
        - name: MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE
          value: readinessState,db
        readinessProbe:
          httpGet: { path: /actuator/health/readiness, port: http }
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 6
        livenessProbe:
          httpGet: { path: /actuator/health/liveness, port: http }
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests: { cpu: 100m, memory: 256Mi }
          limits: { cpu: 500m, memory: 768Mi }
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 10001
          capabilities:
            drop: [ ALL ]
        volumeMounts:
        - name: todo-api-secrets
          mountPath: /mnt/secrets-store
          readOnly: true
      volumes:
      - name: todo-api-secrets
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: todo-api-secrets
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      # The workload identity webhook injects its projected token only into labeled pods.
      # The label is added to the pod template by each environment overlay.
