apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: todo-api-secrets
spec:
  provider: azure
  secretObjects:
    - secretName: todo-api-db
      type: Opaque
      data:
        - objectName: todo-api-db-url
          key: DB_URL
        - objectName: todo-api-db-username
          key: DB_USERNAME
        - objectName: todo-api-db-password
          key: DB_PASSWORD
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: ${WORKLOAD_IDENTITY_CLIENT_ID}
    keyvaultName: ${KEYVAULT_NAME}
    tenantId: ${AZURE_TENANT_ID}
    objects: |
      array:
        - |
          objectName: todo-api-db-url
          objectType: secret
        - |
          objectName: todo-api-db-username
          objectType: secret
        - |
          objectName: todo-api-db-password
          objectType: secret
