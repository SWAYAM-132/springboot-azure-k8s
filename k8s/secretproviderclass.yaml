apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: todo-kv-secrets
  namespace: todo-dev
spec:
  provider: azure

  secretObjects:
    - secretName: todo-db-secrets
      type: Opaque
      data:
        - objectName: db-url
          key: DB_URL
        - objectName: db-username
          key: DB_USERNAME
        - objectName: db-password
          key: DB_PASSWORD

  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "c8621584-9680-442f-9bd4-5c36564516f1"
    keyvaultName: "kv-swayam-todo-dev"
    tenantId: "7731b71e-59e7-46a7-99f3-472d8a0ed1bf"
    objects: |
      array:
        - |
          objectName: db-url
          objectType: secret
        - |
          objectName: db-username
          objectType: secret
        - |
          objectName: db-password
          objectType: secret