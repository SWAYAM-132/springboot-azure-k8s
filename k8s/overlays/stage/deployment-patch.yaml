apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-api
  namespace: todo-nonprod
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: todo-api
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: 750m
              memory: 768Mi
