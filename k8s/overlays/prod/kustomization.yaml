apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: todo-prod

resources:
  - ../../base

images:
  - name: todo-api
    newName: acrtodoplatformci.azurecr.io/todo-api
    newTag: latest

labels:
  - pairs:
      environment: prod
    includeSelectors: false
    includeTemplates: true

patches:
  - path: deployment-patch.yaml
